[package]
name = "astral-core"
version = "0.1.0"
edition = "2021"
description = "Astral 本机内核：嵌入 EasyTier，对本机 GUI 提供 JSON-RPC"
license = "MIT"
publish = false

[[bin]]
name = "astral-core"
path = "src/main.rs"

[[test]]
name = "smoke_engine"
path = "tests/smoke_engine.rs"

[[test]]
name = "rpc_integration"
path = "tests/rpc_integration/main.rs"

[[test]]
name = "service_cleanup"
path = "tests/service_cleanup.rs"

[[test]]
name = "service_lifecycle"
path = "tests/service_lifecycle.rs"

[dependencies]
easytier = { git = "https://github.com/ldoubil/EasyTier.git", features = [
    "wireguard",
    "websocket",
    "quic",
    "tun",
    "smoltcp",
    "socks5",
    "kcp",
    "faketcp",
    "magic-dns",
    "zstd",
] }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service-manager = { git = "https://github.com/EasyTier/service-manager-rs.git", branch = "main" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "fs", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
