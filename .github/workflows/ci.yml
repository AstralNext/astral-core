# 编译并跑自动化测试
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout astral-core
        uses: actions/checkout@v4
        with:
          path: astral-core

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: astral-core
          shared-key: astral-core-${{ matrix.os }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang cmake

      - name: Use vendored Npcap import lib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $libDir = Join-Path $env:GITHUB_WORKSPACE "astral-core\ci\npcap\Lib\x64"
          foreach ($name in @("Packet.lib", "Packet.dll")) {
            if (!(Test-Path (Join-Path $libDir $name))) {
              throw "$name not found in $libDir"
            }
          }
          "LIB=$libDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $libDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: cargo test
        working-directory: astral-core
        run: cargo test --tests -- --nocapture
